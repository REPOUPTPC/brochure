<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor PDF con carga progresiva</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: Arial, sans-serif;
            background: #2c3e50;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: #34495e;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .flipbook-wrapper {
            position: relative;
            width: 800px;
            margin: 0 auto;
        }
        
        #flipbook {
            width: 800px;
            height: 500px;
            background: #ecf0f1;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
            cursor: pointer;
            user-select: none;
        }
        
        .turn-page {
            background-color: white;
            border: 1px solid #bdc3c7;
            overflow: hidden;
            position: relative;
        }
        
        .turn-page.page-loading { background: #f8f9fa; }
        
        .turn-page.page-loading::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(100deg, transparent 30%, rgba(52,152,219,0.12) 50%, transparent 70%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
        }
        
        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        .hover-indicator {
            position: absolute;
            top: 0;
            width: 60px;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        
        .hover-indicator.left {
            left: 0;
            background: linear-gradient(to right, rgba(52, 152, 219, 0.35), transparent);
        }
        
        .hover-indicator.right {
            right: 0;
            background: linear-gradient(to left, rgba(52, 152, 219, 0.35), transparent);
        }
        
        .flipbook-wrapper.hover-left .hover-indicator.left,
        .flipbook-wrapper.hover-right .hover-indicator.right {
            opacity: 1;
        }
        
        .flipbook-wrapper.hover-left #flipbook { cursor: w-resize; }
        .flipbook-wrapper.hover-right #flipbook { cursor: e-resize; }
        
        .pdf-page {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            -webkit-user-drag: none;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        
        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background 0.3s, transform 0.2s;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        button:hover { background: #2980b9; transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        button:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .page-info {
            color: white;
            text-align: center;
            margin-top: 15px;
            font-size: 16px;
        }
        
        .render-status {
            margin-top: 12px;
            text-align: center;
            color: #bdc3c7;
            font-size: 13px;
        }
        
        .render-bar {
            width: 240px;
            height: 4px;
            background: rgba(255,255,255,0.15);
            border-radius: 2px;
            margin: 6px auto 0;
            overflow: hidden;
        }
        
        .render-bar > div {
            height: 100%;
            width: 0%;
            background: #3498db;
            border-radius: 2px;
            transition: width 0.3s;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px 30px;
            border-radius: 5px;
            z-index: 1000;
        }
    </style>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="flipbook-wrapper">
            <div id="flipbook">
                <div class="loading">Cargando PDF...</div>
            </div>
            <div class="hover-indicator left"></div>
            <div class="hover-indicator right"></div>
        </div>
        
        <div class="controls">
            <button id="prev-page" disabled>← Anterior</button>
            <button id="next-page" disabled>Siguiente →</button>
        </div>
        
        <div class="render-status" id="render-status">
            <span id="render-text">Preparando...</span>
            <div class="render-bar"><div id="render-fill"></div></div>
        </div>
        
        <div class="page-info" id="page-info">
            Página 1 de <span id="total-pages">0</span>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
            
            const pdfUrl = 'https://pub-1a8a6736c07b4083b58438c05d3c94b6.r2.dev/archivo_comprimido.pdf';
            
            let pageCount = 0;
            let currentPage = 1;
            let flipbookInitialized = false;
            let isTurning = false;
            let dragStart = null;
            let pagesRendered = 0;
            
            const RENDER_CONCURRENCY = 3;
            
            /* ===== FIX: nuevo estado ===== */
            const pageEls = {};       // FIX: referencia DIRECTA a cada div (capturada ANTES de turn.js)
            const pageImages = {};    // FIX: caché de imágenes ya renderizadas (dataURL)
            const attached = {};      // FIX: páginas que ya tienen su imagen insertada
            const pendingFlush = {};  // FIX: renderizadas pero aún no insertables
            let flushTimer = null;
            let renderQueue = [];     // cola de páginas por renderizar (permite priorizar)
            
            pdfjsLib.getDocument(pdfUrl).promise.then(function(pdf) {
                pageCount = pdf.numPages;
                $('#total-pages').text(pageCount);
                
                const flipbook = $('#flipbook');
                flipbook.empty();
                
                // Crear páginas vacías y guardar la referencia directa a cada nodo
                for (let p = 1; p <= pageCount; p++) {
                    const div = document.createElement('div');
                    div.className = 'turn-page page-loading';
                    div.id = 'page-' + p;
                    pageEls[p] = div;
                    flipbook[0].appendChild(div);
                }
                
                for (let p = 1; p <= pageCount; p++) renderQueue.push(p);
                
                initializeFlipbook();
                renderInBackground(pdf);
                
            }).catch(function(error) {
                console.error('Error cargando PDF:', error);
                $('.loading').text('Error al cargar el PDF').css('background', 'rgba(255,0,0,0.7)');
            });
            
            function renderInBackground(pdf) {
                async function worker() {
                    while (renderQueue.length > 0) {
                        const n = renderQueue.shift();
                        await renderSinglePage(pdf, n);
                    }
                }
                
                const workers = [];
                for (let i = 0; i < RENDER_CONCURRENCY; i++) {
                    workers.push(worker());
                }
                
                Promise.all(workers).then(function() {
                    flushPendingPages(); // FIX: última pasada de inserciones pendientes
                    $('#render-text').text('✔ Todas las páginas cargadas');
                    $('#render-fill').css('width', '100%');
                    $('#render-status').delay(2500).fadeOut(600);
                });
            }
            
            async function renderSinglePage(pdf, pageNum) {
                try {
                    const page = await pdf.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 1.5 });
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    await page.render({
                        canvasContext: ctx,
                        viewport: viewport
                    }).promise;
                    
                    /* FIX: JPEG en vez de PNG (5-10x menos memoria).
                       Cambia a 'image/png' si necesitas calidad máxima. */
                    pageImages[pageNum] = canvas.toDataURL('image/jpeg', 0.85);
                    
                    canvas.width = 0;
                    canvas.height = 0;
                    
                    /* FIX: la imagen se guarda en CACHÉ y se INTENTA insertar.
                       Si el elemento de la página no está accesible (turn.js
                       lo movió/sacó del DOM), queda en cola de reintentos
                       en vez de perderse en silencio. */
                    tryAttachPage(pageNum);
                    
                    pagesRendered++;
                    $('#render-fill').css('width', (pagesRendered / pageCount * 100) + '%');
                    $('#render-text').text('Renderizando en segundo plano: ' + pagesRendered + ' / ' + pageCount);
                    
                } catch (err) {
                    console.error('Error renderizando página ' + pageNum, err);
                }
            }
            
            /* ===== FIX central: inserción segura con reintentos ===== */
            function tryAttachPage(pageNum) {
                if (attached[pageNum] || !pageImages[pageNum]) return true;
                
                // 1º: la referencia directa al nodo original
                let el = pageEls[pageNum];
                
                // 2º: si el nodo ya no está en el documento, buscarlo por id
                //     (por si turn.js trabaja con otra copia del elemento)
                if (!el || !document.contains(el)) {
                    el = document.getElementById('page-' + pageNum);
                }
                
                if (el && document.contains(el)) {
                    const img = document.createElement('img');
                    img.className = 'pdf-page';
                    img.alt = 'Página ' + pageNum;
                    img.src = pageImages[pageNum];
                    el.appendChild(img);
                    el.classList.remove('page-loading');
                    attached[pageNum] = true;
                    delete pendingFlush[pageNum];
                    return true;
                }
                
                // El elemento no está accesible AHORA → reintento posterior
                pendingFlush[pageNum] = true;
                ensureFlushTimer();
                return false;
            }
            
            function flushPendingPages() {
                let remaining = 0;
                for (const n in pendingFlush) {
                    if (!tryAttachPage(parseInt(n, 10))) remaining++;
                }
                if (remaining === 0 && flushTimer) {
                    clearInterval(flushTimer);
                    flushTimer = null;
                }
            }
            
            function ensureFlushTimer() {
                if (!flushTimer) {
                    flushTimer = setInterval(flushPendingPages, 400);
                }
            }
            
            function initializeFlipbook() {
                $('#flipbook').turn({
                    width: 800,
                    height: 500,
                    autoCenter: true,
                    acceleration: true,
                    gradients: true,
                    elevation: 50,
                    duration: 600,
                    display: 'double',
                    when: {
                        turning: function(event, page) {
                            isTurning = true;
                            currentPage = page;
                            
                            // FIX: priorizar el render de la vista entrante
                            // y aprovechar para insertar pendientes
                            prioritize([page - 1, page, page + 1]);
                            flushPendingPages();
                        },
                        turned: function(event, page) {
                            isTurning = false;
                            currentPage = page;
                            updateControls();
                            
                            // FIX: turn.js acaba de colocar los elementos en el
                            // DOM → inyectar las imágenes que estaban pendientes
                            flushPendingPages();
                        }
                    }
                });
                
                flipbookInitialized = true;
                $('.loading').remove();
                updateControls();
                setupHoverEffects();
            }
            
            function prioritize(nums) {
                nums.forEach(function(n) {
                    const idx = renderQueue.indexOf(n);
                    if (idx !== -1) {
                        renderQueue.splice(idx, 1);
                        renderQueue.unshift(n);
                    }
                });
            }
            
            function updateControls() {
                if (!flipbookInitialized) return;
                const page = $('#flipbook').turn('page');
                $('#prev-page').prop('disabled', page <= 1);
                $('#next-page').prop('disabled', page >= pageCount);
                $('#page-info').html('Página ' + page + ' de ' + pageCount);
            }
            
            function safeTurn(action) {
                if (!flipbookInitialized || isTurning) return;
                $('#flipbook').turn(action);
            }
            
            function setupHoverEffects() {
                const flipbook = $('#flipbook');
                const wrapper = $('.flipbook-wrapper');
                
                document.addEventListener('mousedown', function(e) {
                    const el = document.getElementById('flipbook');
                    if (!el) return;
                    const r = el.getBoundingClientRect();
                    const x = e.clientX - r.left;
                    const y = e.clientY - r.top;
                    
                    if (x < 0 || x > r.width || y < 0 || y > r.height) {
                        dragStart = null;
                        return;
                    }
                    
                    dragStart = { x: e.clientX, y: e.clientY, moved: false };
                    
                    const threshold = 150;
                    if (x < threshold || x > r.width - threshold) {
                        e.stopPropagation();
                    }
                }, true);
                
                document.addEventListener('touchstart', function(e) {
                    if (!e.touches || !e.touches.length) return;
                    const t = e.touches[0];
                    const r = document.getElementById('flipbook').getBoundingClientRect();
                    const x = t.clientX - r.left;
                    const y = t.clientY - r.top;
                    if (x >= 0 && x <= r.width && y >= 0 && y <= r.height) {
                        const threshold = 150;
                        if (x < threshold || x > r.width - threshold) {
                            e.stopPropagation();
                        }
                    }
                }, true);
                
                document.addEventListener('mousemove', function(e) {
                    if (dragStart && !dragStart.moved &&
                        (Math.abs(e.clientX - dragStart.x) > 8 ||
                         Math.abs(e.clientY - dragStart.y) > 8)) {
                        dragStart.moved = true;
                    }
                });
                
                flipbook.on('mousemove', function(e) {
                    if (!flipbookInitialized) return;
                    const rect = this.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const threshold = 100;
                    
                    if (mouseX < threshold && currentPage > 1) {
                        wrapper.addClass('hover-left').removeClass('hover-right');
                    } else if (mouseX > rect.width - threshold && currentPage < pageCount) {
                        wrapper.addClass('hover-right').removeClass('hover-left');
                    } else {
                        wrapper.removeClass('hover-left hover-right');
                    }
                });
                
                flipbook.on('mouseleave', function() {
                    wrapper.removeClass('hover-left hover-right');
                });
                
                flipbook.on('click', function(e) {
                    if (!flipbookInitialized || isTurning) return;
                    if (dragStart && dragStart.moved) return;
                    
                    const rect = this.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const threshold = 150;
                    
                    if (mouseX < threshold && currentPage > 1) {
                        safeTurn('previous');
                    } else if (mouseX > rect.width - threshold && currentPage < pageCount) {
                        safeTurn('next');
                    }
                });
            }
            
            $('#prev-page').on('click', function() { safeTurn('previous'); });
            $('#next-page').on('click', function() { safeTurn('next'); });
            
            $(document).on('keydown', function(e) {
                if (!flipbookInitialized) return;
                if (e.keyCode === 37) { e.preventDefault(); safeTurn('previous'); }
                else if (e.keyCode === 39) { e.preventDefault(); safeTurn('next'); }
            });
        });
    </script>
</body>
</html>
